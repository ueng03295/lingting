name: "CI - Test & Audit"

on:
  push:
    branches: [linglisten-v1]
  pull_request:
    branches: [linglisten-v1]

jobs:
  test:
    name: Smoke Tests + Audit
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - uses: actions/checkout@v4

      - name: Smoke tests (scripts/smoke-test.py)
        run: python3 scripts/smoke-test.py

      - name: Static audit — Tauri commands
        # Non-blocking: audit may find pre-existing stubs from upstream Meetily
        # These are informational, not build failures
        run: python3 scripts/audit-tauri-commands.py || echo "⚠️  Audit found issues (informational)"
