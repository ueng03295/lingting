name: "CI - Lint & Test"

# Runs on every push to linglisten-v1 and every PR
# Pure static analysis + Rust tests — no macOS required
# Runs on ubuntu-latest (fast, free, unlimited for public repos)

on:
  push:
    branches: [linglisten-v1]
  pull_request:
    branches: [linglisten-v1]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint-and-test:
    name: Lint & Test (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Rustfmt check
        run: cargo fmt --all --check

      - name: Clippy (warnings as errors)
        run: cargo clippy --all-targets -- -D warnings

      - name: Cargo check
        run: cargo check --all-targets

      - name: Run tests
        run: cargo test --all

      - name: Static audit — Tauri commands
        run: python3 scripts/audit-tauri-commands.py
