name: "CI - Test & Audit"

on:
  push:
    branches: [linglisten-v1]
  pull_request:
    branches: [linglisten-v1]

jobs:
  test:
    name: Smoke Tests + Audit
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run smoke tests (Python + sqlite3)
        run: python3 scripts/smoke-test.py

      - name: Static audit — Tauri commands
        run: python3 scripts/audit-tauri-commands.py
